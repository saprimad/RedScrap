b" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="60" width="220" height="38" rx="5" fill="#64748b"/><text x="130" y="84" text-anchor="middle" font-size="15" fill="white">Input: Reddit API credentials</text><rect x="20" y="112" width="220" height="38" rx="5" fill="#64748b"/><text x="130" y="136" text-anchor="middle" font-size="15" fill="white">Subreddit / keywords / dates</text><rect x="315" y="25" width="300" height="42" rx="5" fill="#14627b"/><text x="465" y="51" text-anchor="middle" font-size="15" fill="white">Validate inputs and initialise PRAW</text><rect x="315" y="90" width="300" height="42" rx="5" fill="#14627b"/><text x="465" y="116" text-anchor="middle" font-size="15" fill="white">Search Reddit Data API</text><rect x="315" y="155" width="300" height="42" rx="5" fill="#14627b"/><text x="465" y="181" text-anchor="middle" font-size="15" fill="white">Filter threads by date</text><rect x="270" y="230" width="190" height="42" rx="5" fill="#14627b"/><text x="365" y="256" text-anchor="middle" font-size="15" fill="white">Scrape selected thread</text><rect x="485" y="230" width="190" height="42" rx="5" fill="#14627b"/><text x="580" y="256" text-anchor="middle" font-size="15" fill="white">Scrape all threads</text><rect x="315" y="310" width="300" height="42" rx="5" fill="#14627b"/><text x="465" y="336" text-anchor="middle" font-size="15" fill="white">Retrieve comments and structure records</text><rect x="735" y="310" width="290" height="42" rx="5" fill="#14627b"/><text x="880" y="336" text-anchor="middle" font-size="15" fill="white">Structured Excel dataset (.xlsx)</text><rect x="315" y="390" width="300" height="42" rx="5" fill="#14627b"/><text x="465" y="416" text-anchor="middle" font-size="15" fill="white">Early Report: retrieve comments</text><rect x="245" y="465" width="320" height="48" rx="5" fill="#14627b"/><text x="405" y="494" text-anchor="middle" font-size="15" fill="white">Descriptive, temporal and lexical analysis</text><rect x="590" y="465" wi